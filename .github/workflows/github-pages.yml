# Simple workflow to build and deploy an Angular app to GitHub Pages
name: Deploy Angular App to GitHub Pages

on:
  # Runs on pushes to the default branch (e.g., main or master)
  push:
    branches:
      - main
      # You can change 'main' to your default branch name if it's different

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # You can change this to your preferred Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # 'ci' is generally faster and more reliable for CI/CD

      - name: Build
        run: |
          # IMPORTANT: Replace <REPO_NAME> with the name of your GitHub repository
          # IMPORTANT: For example, if your repo URL is github.com/user/my-app, use /my-app/
          npm run build -- --base-href /home-calculator/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Change 'my-app' to your Angular project's name
          # (You can find this name in your angular.json file)
          path: './dist/home-calculator' 
          # This path should match the 'outputPath' in your angular.json

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4